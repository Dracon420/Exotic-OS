kiosk_mode:
  hide_header: true
  hide_sidebar: true
  admin_settings:
    hide_header: true
    hide_sidebar: true
title: Miss Cora's Enclosure
views:
- title: Cora
  path: cora
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        name: Back
        tap_action:
          action: navigate
          navigation_path: /exotic-os
        styles:
          card:
          - background: '#050505'
          - border: 1px solid
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#a0b0b5'
          - width: 35px
          name:
          - color: '#a0b0b5'
          - font-weight: bold
          - font-size: 14px
      - type: custom:button-card
        name: Miss Cora — Ball Python
        label: 36×18×18 Enclosure
        show_label: true
        tap_action:
          action: none
        styles:
          card:
          - background: 'linear-gradient(135deg, #050505 0%, #121212 100%)'
          - border: none
          - border-radius: 12px
          name:
          - color: '#e8f4f8'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 24px
          - font-weight: 900
          label:
          - color: '#B026FF'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 14px
      - type: custom:button-card
        icon: mdi:orbit
        tap_action:
          action: none
        styles:
          card:
          - background: '#050505'
          - border: 1px solid
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#00E5FF'
          - width: 40px
          - animation: breathing 3s ease-in-out infinite
          - will-change: transform, filter
        extra_styles: "@keyframes breathing {\n  0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px\
          \ #00E5FF); }\n  50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0px 0px 8px #00E5FF); }\n  100% {\
          \ transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px #00E5FF); }\n}\n"
    - type: horizontal-stack
      cards:
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_8bdc3c_h5072_75_tempc
            name: Hot Temp
            icon: mdi:thermometer
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: 1px solid
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#B026FF'
              - width: 35px
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_87a7fb_h5072_75_tempc
            name: Cool Temp
            icon: mdi:thermometer
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: 1px solid
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#7A4B8F'
              - width: 35px
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_8bdc3c_h5072_75_hum
            name: Hot Hum
            icon: mdi:water-percent
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: 1px solid
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#B026FF'
              - width: 35px
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_87a7fb_h5072_75_hum
            name: Cool Hum
            icon: mdi:water-percent
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: 1px solid
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#7A4B8F'
              - width: 35px
        - type: custom:button-card
          entity: switch.cora_che_socket_1
          name: Ceramic Heat Emitter
          label: '[[[ return states["switch.cora_che_socket_1"].state === "on" ? "ACTIVE" : "STANDBY" ]]]'
          show_label: true
          icon: mdi:radiator
          tap_action:
            action: toggle
          styles:
            card:
            - border-radius: 12px
            - padding: 15px
            - height: 90px
            - transition: all 0.3s ease
            grid:
            - grid-template-columns: 60px auto
            - grid-template-rows: auto auto
            - grid-template-areas: '"i n" "i l"'
            - justify-content: start
            name:
            - color: '#e8f4f8'
            - font-size: 18px
            - font-weight: bold
            - justify-self: start
            label:
            - font-size: 14px
            - justify-self: start
            - font-weight: bold
            icon:
            - width: 45px
          state:
          - value: 'on'
            styles:
              card:
              - background: '#13051A'
              - border: 1px solid
              - box-shadow: 0px 0px 18px rgba(176, 38, 255, 0.4)
              icon:
              - color: '#B026FF'
              - animation: pulse 2s infinite
              - will-change: filter, transform
              label:
              - color: '#B026FF'
          - value: 'off'
            styles:
              card:
              - background: '#080808'
              - border: 1px solid
              icon:
              - color: '#444444'
              label:
              - color: '#444444'
          extra_styles: "@keyframes pulse {\n  0% { filter: drop-shadow(0px 0px 2px #B026FF); }\n  50% { filter: drop-shadow(0px\
            \ 0px 10px #B026FF); }\n  100% { filter: drop-shadow(0px 0px 2px #B026FF); }\n}\n"
      - type: vertical-stack
        cards:
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.thermo_hygrometer_8bdc3c_h5072_75_tempc
            name: Hot Side
          - entity: sensor.thermo_hygrometer_87a7fb_h5072_75_tempc
            name: Cool Side
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.thermo_hygrometer_8bdc3c_h5072_75_hum
            name: Hot Side
          - entity: sensor.thermo_hygrometer_87a7fb_h5072_75_hum
            name: Cool Side
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:video
        name: Camera
        label: Cora Cam — Live
        show_label: true
        tap_action:
          action: navigate
          navigation_path: /coras-enclosure/camera
        styles:
          card:
          - background: '#080808'
          - border: 1px solid
          - border-radius: 12px
          - padding: 15px
          - height: 75px
          grid:
          - grid-template-columns: 45px auto
          - grid-template-areas: '"i n" "i l"'
          - justify-content: start
          icon:
          - color: '#B026FF'
          - width: 35px
          name:
          - color: '#e8f4f8'
          - font-size: 16px
          - font-weight: bold
          - justify-self: start
          label:
          - color: '#a0b0b5'
          - font-size: 12px
          - justify-self: start
      - type: custom:button-card
        icon: mdi:thermometer-auto
        name: Heat Control
        label: CHE · PID Status
        show_label: true
        tap_action:
          action: navigate
          navigation_path: /coras-enclosure/heat-control
        styles:
          card:
          - background: '#080808'
          - border: 1px solid
          - border-radius: 12px
          - padding: 15px
          - height: 75px
          grid:
          - grid-template-columns: 45px auto
          - grid-template-areas: '"i n" "i l"'
          - justify-content: start
          icon:
          - color: '#B026FF'
          - width: 35px
          name:
          - color: '#e8f4f8'
          - font-size: 16px
          - font-weight: bold
          - justify-self: start
          label:
          - color: '#a0b0b5'
          - font-size: 12px
          - justify-self: start
