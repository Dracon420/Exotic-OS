          - font-size: 13px
          state:
          - font-size: 38px
          - font-weight: bold
          icon:
          - width: 32px
        card_mod:
          style: "ha-card {\n  {% set t = states('sensor.thermo_hygrometer_8bdc3c_h5072_75_tempc') | float(0) %}\n  {% if\
            \ t >= 88 and t <= 92 %}\n    background: #0D1A0D !important;\n    border: 1px solid #39FF14 !important;\n  {%\
            \ elif t < 88 %}\n    background: #13051A !important;\n    border: 1px solid #B026FF !important;\n  {% else %}\n\
            \    background: #1A0A00 !important;\n    border: 1px solid #FF6B00 !important;\n  {% endif %}\n} .state {\n \
            \ {% set t = states('sensor.thermo_hygrometer_8bdc3c_h5072_75_tempc') | float(0) %}\n  {% if t >= 88 and t <=\
            \ 92 %}\n    color: #39FF14 !important;\n  {% elif t < 88 %}\n    color: #B026FF !important;\n  {% else %}\n \
            \   color: #FF6B00 !important;\n  {% endif %}\n}\n"
