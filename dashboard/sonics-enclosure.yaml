kiosk_mode:
  hide_header: true
  hide_sidebar: true
  admin_settings:
    hide_header: true
    hide_sidebar: true
title: Sonics Enclosure
views:
- title: Sonic
  path: sonic
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        name: Back
        tap_action:
          action: navigate
          navigation_path: /exotic-os
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#a0b0b5'
          - width: 35px
          name:
          - color: '#a0b0b5'
          - font-weight: bold
          - font-size: 14px
      - type: custom:button-card
        name: Sonic — Crested Gecko
        label: 25.5×21.5×29.5 Grow Tent
        show_label: true
        tap_action:
          action: none
        styles:
          card:
          - background: 'linear-gradient(135deg, #050505 0%, #121212 100%)'
          - border: none
          - border-radius: 12px
          name:
          - color: '#e8f4f8'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 24px
          - font-weight: '900'
          label:
          - color: '#39FF14'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 14px
      - type: custom:button-card
        icon: mdi:orbit
        tap_action:
          action: none
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#00E5FF'
          - width: 40px
          - animation: breathing 3s ease-in-out infinite
          - will-change: transform, filter
        extra_styles: "@keyframes breathing {\n  0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px\
          \ #00E5FF); }\n  50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0px 0px 8px #00E5FF); }\n  100% {\
          \ transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px #00E5FF); }\n}\n"
    - type: horizontal-stack
      cards:
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
