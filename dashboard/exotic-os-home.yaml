              \ : '--';\n  var h_val = h ? parseFloat(h.state).toFixed(0) : '--';\n  return t_val + '°F / ' + h_val + '%';\n\
              ]]]\n"
            show_label: true
            styles:
              card:
              - background: '#0a0a0a'
              - border: '1px solid #222'
              - border-radius: 8px
              - padding: 10px
              - box-shadow: 0px 0px 10px rgba(255, 107, 0, 0.2)
              name:
              - color: '#006B80'
              - font-weight: bold
              - font-size: 16px
              - font-family: monospace
              label:
              - color: '#00E5FF'
              - font-size: 18px
              - font-family: monospace
              - text-shadow: '0px 0px 5px #00E5FF'
    extra_styles: "@keyframes scroll-top {\n  0%   { transform: translateX(780px); }\n  100% { transform: translateX(-1500px);\
      \ }\n}\n@keyframes scroll-bottom {\n  0%   { transform: translateX(780px); }\n  100% { transform: translateX(-800px);\
      \ }\n}\n@keyframes pulse {\n  0%, 100% { transform: scale(0.85); opacity: 0.1; }\n  50%      { transform: scale(1.1);\
      \ opacity: 0.6; }\n}\n/* This locks Albedo to the vertical center (top: 160px) */\n@keyframes patrol-mid {\n  0%   {\
      \ top: 160px; left: 100px; }\n  50%  { top: 160px; left: 530px; }\n  100% { top: 160px; left: 100px; }\n}\n"
