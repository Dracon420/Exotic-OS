- title: Heat Control
  path: heat-control
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        name: Back
        tap_action:
          action: navigate
          navigation_path: /coras-enclosure/cora
        styles:
          card:
          - background: '#050505'
