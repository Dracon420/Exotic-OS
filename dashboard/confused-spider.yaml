kiosk_mode:
  hide_header: true
  hide_sidebar: true
  admin_settings:
    hide_header: true
    hide_sidebar: true
title: Confused Spider BP
views:
- title: Confused Spider
  path: confused-spider-bp
  type: panel
  card_mod:
    style: |
      :host {
        cursor: none !important;
      }
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        name: Back
        tap_action:
          action: navigate
          navigation_path: /exotic-os
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#a0b0b5'
          - width: 35px
          name:
          - color: '#a0b0b5'
          - font-weight: bold
          - font-size: 14px
      - type: custom:button-card
        name: Confused Spider — Ball Python
        label: 42L Tub Enclosure
        show_label: true
        tap_action:
          action: none
        styles:
          card:
          - background: 'linear-gradient(135deg, #050505 0%, #121212 100%)'
          - border: none
          - border-radius: 12px
          name:
          - color: '#e8f4f8'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 24px
          - font-weight: '900'
          label:
          - color: '#00BFFF'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 14px
      - type: custom:button-card
        icon: mdi:orbit
        tap_action:
          action: none
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#00E5FF'
          - width: 40px
          - animation: breathing 3s ease-in-out infinite
          - will-change: transform, filter
        extra_styles: "@keyframes breathing {\n  0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px\
          \ #00E5FF); }\n  50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0px 0px 8px #00E5FF); }\n  100% {\
          \ transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px #00E5FF); }\n}\n"
    - type: horizontal-stack
      cards:
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            entity: sensor.smart_thermo_hygrometer_c6332c_h5100_01_02_04_05_08_74_77_tempc
            name: Ambient Temp
            icon: mdi:thermometer
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: '1px solid #1a1a1a'
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#00BFFF'
              - width: 35px
          - type: custom:button-card
            entity: sensor.smart_thermo_hygrometer_c6332c_h5100_01_02_04_05_08_74_77_hum
            name: Ambient Hum
            icon: mdi:water-percent
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: '1px solid #1a1a1a'
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#00BFFF'
              - width: 35px
        - type: custom:button-card
          entity: switch.smart_socket_socket_1
          name: Heat Mat
          label: '[[[ var s = states["switch.smart_socket_socket_1"]; return s ? (s.state === "on" ? "ACTIVE" : "STANDBY")
            : "--" ]]]'
          show_label: true
          icon: mdi:heating-coil
          tap_action:
            action: toggle
          styles:
            card:
            - border-radius: 12px
            - padding: 15px
            - height: 90px
            - transition: all 0.3s ease
            grid:
            - grid-template-columns: 60px auto
            - grid-template-rows: auto auto
            - grid-template-areas: '"i n" "i l"'
            - justify-content: start
            name:
            - color: '#e8f4f8'
            - font-size: 18px
            - font-weight: bold
            - justify-self: start
            label:
            - font-size: 14px
            - justify-self: start
            - font-weight: bold
            icon:
            - width: 45px
          state:
          - value: 'on'
            styles:
              card:
              - background: '#001A22'
              - border: '1px solid #00BFFF'
              - box-shadow: 0px 0px 18px rgba(0, 191, 255, 0.4)
              icon:
              - color: '#00BFFF'
              - animation: pulse-blue 2s infinite
              - will-change: filter, transform
              label:
              - color: '#00BFFF'
          - value: 'off'
            styles:
              card:
              - background: '#080808'
              - border: '1px solid #1a1a1a'
              icon:
              - color: '#444444'
              label:
              - color: '#444444'
          extra_styles: "@keyframes pulse-blue {\n  0% { filter: drop-shadow(0px 0px 2px #00BFFF); }\n  50% { filter: drop-shadow(0px\
            \ 0px 10px #00BFFF); }\n  100% { filter: drop-shadow(0px 0px 2px #00BFFF); }\n}\n"
      - type: vertical-stack
        cards:
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.smart_thermo_hygrometer_c6332c_h5100_01_02_04_05_08_74_77_tempc
            name: Ambient Temp
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.smart_thermo_hygrometer_c6332c_h5100_01_02_04_05_08_74_77_hum
            name: Ambient Hum
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
