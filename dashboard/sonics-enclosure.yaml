              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: '1px solid #1a1a1a'
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
