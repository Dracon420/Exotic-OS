      - type: custom:button-card
        name: Heat Control
        label: "[[[ return states[\"input_boolean.cora_pid_enabled\"].state === \"on\"\n    ? \"PID ACTIVE\"\n    : \"PID\
          \ DISABLED\" ]]]"
        show_label: true
        tap_action:
          action: none
        styles:
          card:
          - background: 'linear-gradient(135deg, #050505 0%, #121212 100%)'
          - border: none
          - border-radius: 12px
          name:
          - color: '#e8f4f8'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 24px
          - font-weight: 900
          label:
          - font-family: monospace
          - font-size: 13px
          - letter-spacing: 1px
        card_mod:
          style: ".label {\n  {% if states('input_boolean.cora_pid_enabled') == 'on' %}\n    color: #39FF14 !important;\n\
            \  {% else %}\n    color: #555555 !important;\n  {% endif %}\n}\n"
      - type: custom:button-card
        icon: mdi:orbit
        tap_action:
          action: none
        styles:
