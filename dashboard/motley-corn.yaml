kiosk_mode:
  hide_header: true
  hide_sidebar: true
  admin_settings:
    hide_header: true
    hide_sidebar: true
title: Motley Corn Snake
views:
- title: Motley
  path: motley
  type: panel
  cards:
  - type: vertical-stack
    cards:
    - type: horizontal-stack
      cards:
      - type: custom:button-card
        icon: mdi:chevron-left
        name: Back
        tap_action:
          action: navigate
          navigation_path: /exotic-os
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#a0b0b5'
          - width: 35px
          name:
          - color: '#a0b0b5'
          - font-weight: bold
          - font-size: 14px
      - type: custom:button-card
        name: Motley — Corn Snake
        label: 10 Gallon Enclosure
        show_label: true
        tap_action:
          action: none
        styles:
          card:
          - background: 'linear-gradient(135deg, #050505 0%, #121212 100%)'
          - border: none
          - border-radius: 12px
          name:
          - color: '#e8f4f8'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 24px
          - font-weight: '900'
          label:
          - color: '#FF6B00'
          - font-family: '"Segoe UI", sans-serif'
          - font-size: 14px
      - type: custom:button-card
        icon: mdi:orbit
        tap_action:
          action: none
        styles:
          card:
          - background: '#050505'
          - border: '1px solid #1a1a1a'
          - border-radius: 12px
          - width: 85px
          icon:
          - color: '#00E5FF'
          - width: 40px
          - animation: breathing 3s ease-in-out infinite
          - will-change: transform, filter
        extra_styles: "@keyframes breathing {\n  0% { transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px\
          \ #00E5FF); }\n  50% { transform: scale(1.1); opacity: 1; filter: drop-shadow(0px 0px 8px #00E5FF); }\n  100% {\
          \ transform: scale(0.9); opacity: 0.7; filter: drop-shadow(0px 0px 2px #00E5FF); }\n}\n"
    - type: horizontal-stack
      cards:
      - type: vertical-stack
        cards:
        - type: grid
          columns: 2
          square: false
          cards:
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_e81c61_h5072_75_tempc
            name: Temp
            icon: mdi:thermometer
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: '1px solid #1a1a1a'
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#FF6B00'
              - width: 35px
          - type: custom:button-card
            entity: sensor.thermo_hygrometer_e81c61_h5072_75_hum
            name: Humidity
            icon: mdi:water-percent
            show_state: true
            tap_action:
              action: more-info
            styles:
              card:
              - background: '#080808'
              - border-radius: 12px
              - padding: 15px
              - border: '1px solid #1a1a1a'
              name:
              - color: '#a0b0b5'
              - font-size: 14px
              - margin-bottom: 5px
              state:
              - color: '#e8f4f8'
              - font-size: 26px
              - font-weight: bold
              icon:
              - color: '#FF6B00'
              - width: 35px
        - type: markdown
          content: '<span style="font-family:''Courier New'',monospace;font-size:11px;font-weight:700;color:#FF6B00;letter-spacing:2px;">⚠
            SYSTEM ADVISORY</span>

            Temperature gradient is difficult to maintain in a 10-gallon enclosure. This is a physics limitation of the enclosure
            size, not a control issue. Larger enclosure recommended as Motley grows.

            '
          card_mod:
            style: "ha-card {\n  background: #0D0500 !important;\n  border: 1px solid #FF6B00 !important;\n  border-radius:\
              \ 12px !important;\n  padding: 4px 8px !important;\n  box-shadow: 0px 0px 12px rgba(255, 107, 0, 0.1) !important;\n\
              \  margin-top: 8px !important;\n  color: #888 !important;\n  font-size: 12px !important;\n  line-height: 1.5\
              \ !important;\n}\n"
      - type: vertical-stack
        cards:
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.thermo_hygrometer_e81c61_h5072_75_tempc
            name: Temp
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
        - type: history-graph
          hours_to_show: 24
          entities:
          - entity: sensor.thermo_hygrometer_e81c61_h5072_75_hum
            name: Humidity
          card_mod:
            style: "ha-card {\n  background: #080808 !important;\n  border-radius: 12px !important;\n  border: 1px solid #1a1a1a\
              \ !important;\n}\n"
